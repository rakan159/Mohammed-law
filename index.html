.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.card{background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(6px);border:1px solid var(--bd);border-radius:14px;padding:14px;box-shadow:0 1px 3px #0000000a}

.ck{cursor:pointer;transition:.15s}.ck:hover{transform:translateY(-2px);box-shadow:0 6px 16px #0002}.lk{cursor:pointer}.lk:hover{color:var(--pri)}

.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--bd);font-size:14px}.row:last-child{border:0}.row small{color:var(--mut)}

#m{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:16px;z-index:9}#m.on{display:flex}#m .card{background:var(--card);backdrop-filter:none;width:100%;max-width:420px;max-height:90%;overflow:auto}
.search{max-width:230px;margin:0}

#ps{display:none;--tx:#000;--mut:#555;--bd:#999}
#ps.on{display:block;position:fixed;inset:0;background:#fff;color:#000;overflow:auto;z-index:20;padding:calc(env(safe-area-inset-top,0px) + 16px) 18px 24px}
.pb{position:sticky;top:0;display:flex;gap:8px;margin-bottom:12px;background:#fff;padding:6px 0}
#ps th,#ps td{border:1px solid #999;padding:8px;text-align:start;white-space:normal;font-size:14px}#ps th{background:#f1f1f1}
@media print{body.pm>*:not(#ps){display:none!important}body.pm{display:block;background:#fff}body.pm:before,body.pm:after{display:none}#ps.on{position:static;padding:0;overflow:visible}.pb{display:none}}
@media(max-width:720px){body{flex-direction:column}nav{width:100%;height:auto;flex-direction:row;overflow-x:auto;position:sticky;top:0;padding:8px}.logo{display:none}nav button{white-space:nowrap;gap:6px}main{padding:14px}}

<div id="lg" style="position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px"><div class="card" style="width:100%;max-width:360px"><h1 style="text-align:center;font-size:19px">إدارة مكتب المحامي<br>محمد شامان آل منصور</h1><label style="font-size:13px">البريد الإلكتروني</label><input id="le" type="email" autocomplete="username"><label style="font-size:13px">كلمة السر</label><input id="lp" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')li()"><div id="lm" style="color:var(--bad);font-size:13px;min-height:20px"></div><button class="btn" style="width:100%" onclick="li()">تسجيل الدخول</button><button class="btn" id="dmb" style="width:100%;margin-top:8px;background:var(--mut)" onclick="dm()">🧪 تجربة بدون حساب (بيانات تجريبية)</button><small style="display:block;margin-top:8px;color:var(--mut);text-align:center">الوضع التجريبي لا يصل لبياناتك الحقيقية ولا يحفظ شيئاً.</small></div></div>

<script>
const T=[['dash','لوحة التحكم'],['cases','القضايا'],['contracts','العقود'],['tasks','المهام'],['hearings','الجلسات'],['docs','المستندات'],['billing','المالية'],['cal','📅 التقويم'],['parties','👥 الموكلون والأطراف'],['lic','🪪 وكالات وتراخيص'],['laws','📚 مكتبة الأنظمة'],['search','🔍 بحث شامل'],['tools','🧰 أدوات المكتب']];
const S=(a)=>['select',a];
const F={
cases:{t:'قضية',f:[['no','رقم القضية'],['title','عنوان القضية'],['client','الموكل / الجهة'],['opp','الخصم'],['court','المحكمة'],['hearing','الجلسة القادمة','date'],['status','الحالة','select',['جارية','مستأنفة','معلّقة','منتهية']]]},
contracts:{t:'عقد',f:[['title','عنوان العقد'],['party','الطرف الآخر'],['value','القيمة (ريال)','number'],['end','تاريخ الانتهاء','date'],['status','الحالة','select',['ساري','قيد المراجعة','منتهي']]]},
tasks:{t:'مهمة',f:[['title','المهمة'],['owner','المسؤول'],['due','الاستحقاق','date'],['status','الحالة','select',['مفتوحة','قيد التنفيذ','مكتملة']]]},
docs:{t:'مستند',f:[['title','اسم المستند'],['kind','النوع','select',['مذكرة','لائحة','صك','عقد','وكالة','أخرى']],['rel','رقم القضية المرتبط'],['date','التاريخ','date'],['link','رابط الملف (اختياري)'],['note','ملاحظات']]},
billing:{t:'قيد مالي',f:[['title','البيان'],['kind','النوع','select',['أتعاب','ساعات عمل','مصروف']],['client','الموكل / الجهة'],['case','رقم القضية (اختياري)'],['amount','المبلغ (ريال)','number'],['date','التاريخ','date'],['status','الحالة','select',['غير مدفوع','مدفوع']]]}
};
F.lic={t:'وكالة/ترخيص',f:[['title','الاسم / الرقم'],['party','الجهة / الموكل'],['end','تاريخ الانتهاء','date'],['status','الحالة','select',['ساري','منتهي']]]};
const done=/منتهي|مكتملة|مدفوع$/;
let D={cases:[],contracts:[],tasks:[],docs:[],billing:[],lic:[]},cur='dash',q='';
const sb=supabase.createClient('https://fcfuxsmqbprgeundpryu.supabase.co','sb_publishable_L-yxECDXRHhp9-DOG7-VIQ_D8irfggS');
const TB=['cases','contracts','tasks','docs','billing','lic','laws'],last={};TB.forEach(k=>last[k]={});let SYT='',syT=null,busy=false,again=false,DEMO=false;const DEMO_ON=true;
const sy=t=>{SYT=t;const e=document.getElementById('sy');if(e)e.textContent=t};
function save(){if(DEMO){sy('🧪 وضع تجريبي — لا يُحفظ شيء');return}sy('⏳ جارٍ الحفظ...');clearTimeout(syT);syT=setTimeout(push,500)}
async function push(){if(DEMO)return;if(busy){again=true;return}busy=true;
try{for(const k of TB){const a=D[k]||(D[k]=[]),cu={},up=[];
a.forEach(r=>{if(!r._id)r._id=crypto.randomUUID();const{_id,...data}=r,j=JSON.stringify(data);cu[_id]=j;if(last[k][_id]!==j)up.push({id:_id,data})});
const dl=Object.keys(last[k]).filter(id=>!(id in cu));
if(up.length){const e=(await sb.from(k).upsert(up)).error;if(e)throw e}
if(dl.length){const e=(await sb.from(k).delete().in('id',dl)).error;if(e)throw e}
last[k]=cu}
sy('☁️ تم الحفظ في السحابة')}catch(e){sy('⚠️ تعذر الحفظ — تحقق من الاتصال');console.error(e)}
busy=false;if(again){again=false;save()}}
async function load(){sy('⏳ جارٍ التحميل...');const nd={};
for(const k of TB){const r=await sb.from(k).select('id,data').order('created_at');if(r.error){if(k==='laws'){nd[k]=[];last[k]={};continue}throw r.error}
nd[k]=r.data.map(x=>({...x.data,_id:x.id}));last[k]={};r.data.forEach(x=>last[k][x.id]=JSON.stringify(x.data))}
D={...D,...nd};sy('☁️ متصل')}
async function of(p){if(!p)return;const w=window.open('','_blank'),r=await sb.storage.from('files').createSignedUrl(p,300);if(r.error||!r.data){if(w)w.close();al('تعذر فتح الملف');return}if(w)w.location=r.data.signedUrl;else location.href=r.data.signedUrl}
async function li(){const e=document.getElementById('le').value.trim(),p=document.getElementById('lp').value,m=document.getElementById('lm');m.textContent='';
if(!e||!p){m.textContent='أدخل البريد وكلمة السر';return}
const r=await sb.auth.signInWithPassword({email:e,password:p});if(r.error){m.textContent='بيانات الدخول غير صحيحة';return}
await start()}
async function start(){try{await load()}catch(e){console.error(e);sy('⚠️ تعذر تحميل البيانات')}document.getElementById('lg').style.display='none';render();popup()}
async function lo(){try{clearTimeout(syT);await push()}catch(e){}try{await sb.auth.signOut()}catch(e){}location.reload()}
function dm(){DEMO=true;SYT='🧪 وضع تجريبي — لا يُحفظ شيء';demo();document.getElementById('lg').style.display='none';render();popup()}
async function init(){if(!DEMO_ON)document.getElementById('dmb').style.display='none';try{const s=(await sb.auth.getSession()).data.session;if(s)await start()}catch(e){console.error(e)}}
const pd=d=>new Date(d+'T00:00:00');const days=d=>{if(!d)return null;const n=Math.round((pd(d)-new Date(new Date().toDateString()))/864e5);return isNaN(n)?null:n};
const fmt=d=>{if(!d||isNaN(pd(d)))return'—';const t=pd(d),o={day:'numeric',month:'short',year:'numeric'};return t.toLocaleDateString('ar-SA-u-ca-gregory',o)+' ('+t.toLocaleDateString('ar-SA-u-ca-islamic-umalqura',o)+')'};
const money=n=>(+n||0).toLocaleString('ar-SA')+' ر.س';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function badge(d,off){const n=days(d);if(n===null||off)return'';return n<0?'<span class="tag bad">متأخر</span>':n<=7?`<span class="tag warn">بعد ${n} يوم</span>`:`<span class="tag">بعد ${n} يوم</span>`}
// أتمتة: تنبيهات تلقائية
function alerts(){const a=[];D.lic=D.lic||[];
D.cases.forEach(c=>{const n=days(c.hearing);if(c.status!=='منتهية'&&n!==null&&n>=0&&n<=7)a.push({g:['cases',c.no||c.title],t:`جلسة قضية "${c.title}" بعد ${n} يوم`,task:`التحضير لجلسة: ${c.title}`,due:c.hearing})});
D.contracts.forEach(c=>{const n=days(c.end);if(c.status==='ساري'&&n!==null&&n<=30)a.push({g:['contracts',c.title],t:n<0?`العقد "${c.title}" منتهي`:`العقد "${c.title}" ينتهي بعد ${n} يوم`,task:`تجديد/مراجعة عقد: ${c.title}`,due:c.end})});
D.tasks.forEach(t=>{if(t.status!=='مكتملة'&&days(t.due)<0&&t.due)a.push({g:['tasks',t.title],t:`مهمة متأخرة: ${t.title}`})});
D.billing.forEach(b=>{if(b.kind!=='مصروف'&&b.status==='غير مدفوع'&&b.date&&days(b.date)<-30)a.push({g:['billing',b.title],t:`فاتورة متأخرة السداد: ${b.title} (${money(b.amount)})`})});
D.lic.forEach(l=>{const n=days(l.end);if(l.status==='ساري'&&n!==null&&n<=30)a.push({g:['lic',l.title],t:n<0?`انتهت: ${l.title}`:`${l.title} تنتهي بعد ${n} يوم`,task:'تجديد: '+l.title,due:l.end})});
return a}
function nav(){const n=alerts().length;document.getElementById('nav').innerHTML='<div class="logo"><svg width="26" height="26" viewBox="0 0 120 120" fill="none" stroke="#f3d08a" stroke-width="7"><path d="M60 20v78M40 98h40M25 38h70M25 38l-12 28h24zM95 38l-12 28h24z"/></svg><span style="font-size:14px;line-height:1.55">إدارة مكتب المحامي<br>محمد شامان آل منصور</span></div>'+T.map(([k,l])=>`<button class="${k===cur?'on':''}" onclick="go('${k}')">${l}${k==='dash'&&n?`<i>${n}</i>`:''}</button>`).join('')+'<div style="margin-top:auto"></div>'+(STAND()?'':'<button onclick="inst()">📲 تثبيت كتطبيق</button>')+'<button onclick="lo()">⎋ تسجيل خروج</button><div id="sy" style="font-size:11px;opacity:.85;padding:6px 10px">'+SYT+'</div>'}
let fl=null;const PRE={copen:r=>r.status!=='منتهية',cact:r=>r.status==='ساري',topen:r=>r.status!=='مكتملة',unp:r=>r.kind!=='مصروف'&&r.status!=='مدفوع',arch:r=>r.arch};const PL={copen:'القضايا المفتوحة',cact:'العقود السارية',topen:'المهام المفتوحة',unp:'المستحقات غير المسددة',arch:'الأرشيف'};
function go(k,s,f){cur=k;q=s||'';fl=f||null;render()}

function render(){nav();const v=document.getElementById('v');
if(cur==='dash'){
const al=alerts(),inc=D.billing.filter(b=>b.kind!=='مصروف'),paid=inc.filter(b=>b.status==='مدفوع').reduce((s,b)=>s+ +b.amount,0),unp=inc.filter(b=>b.status!=='مدفوع').reduce((s,b)=>s+ +b.amount,0),exp=D.billing.filter(b=>b.kind==='مصروف').reduce((s,b)=>s+ +b.amount,0);
const hs=D.cases.filter(c=>c.hearing&&days(c.hearing)>=0).sort((a,b)=>a.hearing>b.hearing?1:-1).slice(0,4);
const L=(a,f)=>a.length?a.map(f).join(''):'<small style="color:var(--mut)">لا يوجد</small>';
v.innerHTML=`<div class="hero"><svg viewBox="0 0 120 120" fill="none" stroke="#fff" stroke-width="3"><path d="M60 14v84M38 98h44M20 34h80M20 34l-14 32h28zM100 34l-14 32h28z"/></svg><h2><em>إدارة مكتب المحامي محمد شامان آل منصور</em></h2><p>قضاياك وعقودك ومستنداتك ومهامك وأتعابك في مكان واحد — ${new Date().toLocaleDateString('ar-SA',{weekday:'long',day:'numeric',month:'long'})}</p></div>
${wk()}
<div class="grid"><div class="card kpi ck" onclick="go('cases','','copen')"><b>${D.cases.filter(c=>c.status!=='منتهية').length}</b><span>قضايا مفتوحة</span></div><div class="card kpi ck" onclick="go('contracts','','cact')"><b>${D.contracts.filter(c=>c.status==='ساري').length}</b><span>عقود سارية</span></div><div class="card kpi ck" onclick="go('tasks','','topen')"><b>${D.tasks.filter(t=>t.status!=='مكتملة').length}</b><span>مهام مفتوحة</span></div><div class="card kpi ck" onclick="go('billing')"><b style="font-size:19px">${money(paid)}</b><span>أتعاب محصّلة</span></div><div class="card kpi ck" onclick="go('billing','','unp')"><b style="font-size:19px;color:var(--warn)">${money(unp)}</b><span>مستحقات غير مسددة</span></div><div class="card kpi ck" onclick="go('billing','مصروف')"><b style="font-size:19px">${money(exp)}</b><span>المصروفات</span></div></div>
